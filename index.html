<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>System Driver Utility</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; 
    height: 100vh; width: 100vw; color: #0f0; 
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; touch-action: none; overscroll-behavior: none;
  }

  /* Начальный безобидный экран */
  #safe-start {
    position: fixed; inset: 0; background: #f4f5f7; z-index: 99999;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
    color: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: opacity 0.5s ease;
  }
  #safe-start h3 { font-size: 16px; font-weight: 500; margin-bottom: 8px; }
  #safe-start .spinner {
    width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #007aff;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Слои вируса */
  #stress-layer { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; opacity: 0; transition: opacity 2s; }
  
  #terminal { padding: 15px; font-size: 12px; line-height: 1.2; white-space: pre-wrap; word-break: break-all; font-weight: bold; height: 100%; overflow: hidden; text-align: left; z-index: 10; position: relative; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000; opacity: 0; transition: opacity 1s; }
  .red { color: #ff0000; text-shadow: 0 0 10px #ff0000, 2px 2px 0 #000; }
  .white { color: #ffffff; text-shadow: 2px 2px 0 #000; }
  .green { color: #00ff00; text-shadow: 0 0 5px #00ff00, 2px 2px 0 #000; }
  .gray { color: #999999; text-shadow: 2px 2px 0 #000; }

  #flash { position: fixed; inset: 0; background: #f00; opacity: 0; pointer-events: none; z-index: 99; mix-blend-mode: difference; }
  
  #glitch-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 950; opacity: 0; font-size: 8px; color: #0f0; overflow: hidden; word-break: break-all; transition: opacity 1s; }

  /* Финальный оверлей таймера */
  #lock-overlay { position: fixed; inset: 0; z-index: 900; background: rgba(5, 0, 0, 0.88); display: none; justify-content: center; align-items: center; flex-direction: column; pointer-events: all; border: 15px solid #f00; box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.6); }
  #timer-text { color: #f00; font-size: 18px; letter-spacing: 4px; margin-bottom: 10px; text-shadow: 0 0 15px #f00; font-weight: bold; }
  #timer { font-size: 32vh; color: #f00; font-weight: bold; text-shadow: 0 0 70px #f00, 0 0 140px #f00; line-height: 1; }
  #warning-text { color: #fff; font-size: 15px; margin-top: 20px; animation: blink 0.25s infinite; font-weight: bold; letter-spacing: 2px; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .shaking { animation: shake 0.05s infinite; }
  @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(-6px, 4px) rotate(-1deg); } 50% { transform: translate(6px, -4px) rotate(1deg); } 75% { transform: translate(-4px, -6px); } 100% { transform: translate(0,0); } }
</style>
</head>
<body>

<!-- 1. Безобидное начало -->
<div id="safe-start">
  <div class="spinner"></div>
  <h3>Проверка драйвера устройства</h3>
  <p style="font-size: 12px; color: #888;">Подождите, идет сканирование...</p>
</div>

<!-- 2. Фоновая WebGL-нагрузка -->
<canvas id="stress-layer"></canvas>

<!-- 3. Терминал -->
<div id="terminal"></div>

<!-- 4. Глитч-слой -->
<div id="glitch-layer"></div>
<div id="flash"></div>

<!-- 5. Финальная блокировка -->
<div id="lock-overlay">
  <div id="timer-text">УНИЧТОЖЕНИЕ ДАННЫХ:</div>
  <div id="timer">40</div>
  <div id="warning-text">ВЫХОД ЗАБЛОКИРОВАН</div>
</div>

<script>
/* ==========================================================================
   ЧАСТЬ 1: СКРЫТЫЙ КОНТЕКСТ ЗВУКА И WEBGL
   ========================================================================== */
let audioCtx = null;
let webglActive = false;
const canvas = document.getElementById('stress-layer');
const gl = canvas.getContext('webgl');

// Инициализация звука только после первого касания пользователя
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });

function playHarshGlitch() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(Math.random() * 1000 + 300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.18);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.18);
  } catch(e) {}
}

/* ==========================================================================
   ЧАСТЬ 2: ВЫСОКОНАГРУЖЕННЫЙ WEBGL ФРАКТАЛ (RAYMARCHING)
   ========================================================================== */
if (gl) {
  const vsSource = `attribute vec2 a_position; void main() { gl_Position = vec4(a_position, 0.0, 1.0); }`;
  const fsSource = `
    precision highp float;
    uniform vec2 u_resolution;
    uniform float u_time;
    float map(vec3 p) {
        vec3 z = p; float dr = 1.0; float r = 0.0;
        for (int i = 0; i < 8; i++) {
            r = length(z); if (r > 2.0) break;
            float theta = acos(z.z/r);
            float phi = atan(z.y, z.x);
            dr = pow(r, 8.0)*8.0*dr + 1.0;
            float zr = pow(r, 8.0);
            theta = theta*8.0; phi = phi*8.0;
            z = zr*vec3(sin(theta)*cos(phi), sin(phi)*sin(theta), cos(theta));
            z += p;
        }
        return 0.5*log(r)*r/dr;
    }
    void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / u_resolution.y;
        vec3 ro = vec3(0.0, 0.0, -3.0 + sin(u_time)*0.4);
        vec3 rd = normalize(vec3(uv, 1.0));
        float t = 0.0;
        for (int i = 0; i < 90; i++) {
            vec3 p = ro + rd * t;
            float d = map(p);
            if (d < 0.001 || t > 4.5) break;
            t += d;
        }
        vec3 col = vec3(0.0);
        if (t < 4.5) {
            vec3 p = ro + rd * t;
            col = vec3(sin(p.x*4.0 + u_time)*0.5+0.5, cos(p.y*4.0)*0.5+0.5, sin(p.z*4.0)*0.5+0.5);
        }
        gl_FragColor = vec4(col, 1.0);
    }
  `;
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(prog); gl.useProgram(prog);
  
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  
  const aPos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uTime = gl.getUniformLocation(prog, 'u_time');
  
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uRes, canvas.width, canvas.height);

  let startTs = 0;
  function render() {
    if (!webglActive) return;
    gl.uniform1f(uTime, (performance.now() - startTs) / 1000.0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  window.startHeavyWebGL = () => { startTs = performance.now(); webglActive = true; render(); };
}

/* ==========================================================================
   ЧАСТЬ 3: КАСКАДНЫЙ СЦЕНАРИЙ РАЗРУШЕНИЯ
   ========================================================================== */
const terminal = document.getElementById('terminal');
const glitchLayer = document.getElementById('glitch-layer');
const safeStart = document.getElementById('safe-start');
const lockOverlay = document.getElementById('lock-overlay');
const timerEl = document.getElementById('timer');

const logLines = [
  { t: "[ OK ] Системные драйверы загружены.", c: "gray" },
  { t: "[ WARN ] Критический сбой модуля kernel32.dll", c: "red" },
  { t: "[ ! ] Внедрение вредоносного кода в сектор 0x00A3F...", c: "red" },
  { t: "root@android:/ # sudo wipe --force", c: "white" },
  { t: "[ ERR ] Повреждение памяти (0xDEADBEEF)", c: "red" },
  { t: "[ ERR ] SELinux заблокирован", c: "red" },
  { t: "[ X ] УТЕЧКА ПЕРСОНАЛЬНЫХ ДАННЫХ", c: "red" },
  { t: "[ X ] ДОСТУП К КАМЕРЕ И ГАЛЕРЕЕ", c: "red" },
  { t: "> АХАЗАЗА... ТЫ ПОПАЛСЯ.", c: "red" },
  { t: "> ПИЗДА ТЕБЕ.", c: "red" },
  { t: "> СИСТЕМА УНИЧТОЖЕНА.", c: "red" }
];

// Мягкое появление текста
function initTerminalText() {
  terminal.style.opacity = "1";
  logLines.forEach((line, index) => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = line.c;
      div.textContent = line.t;
      terminal.appendChild(div);
      if (line.c === 'red') playHarshGlitch();
    }, index * 180);
  });
}

// Запуск разрушительного WebGL и мерцания
function escalateToChaos() {
  if (window.startHeavyWebGL) window.startHeavyWebGL();
  document.getElementById('stress-layer').style.opacity = "0.4";
  glitchLayer.style.opacity = "0.25";
  
  const glitchInterval = setInterval(() => {
    let garbage = "";
    const chars = "ABCDEF0123456789_!@#$%^&*";
    for (let i = 0; i < 400; i++) garbage += chars[Math.floor(Math.random() * chars.length)];
    glitchLayer.textContent = garbage;
  }, 35);

  setTimeout(() => {
    document.body.classList.add('shaking');
    lockOverlay.style.display = "flex";
    startFinalCountdown(glitchInterval);
  }, 4500); // Через 4.5 секунды после начала терминала
}

// Финальный отсчет с блокировкой выхода
function startFinalCountdown(glitchInt) {
  // Защита от закрытия страницы
  window.addEventListener('beforeunload', (e) => {
    e.preventDefault();
    e.returnValue = "ВНИМАНИЕ! Уничтожение данных не завершено.";
    return e.returnValue;
  });

  // Блокировка кнопки "Назад"
  history.pushState(null, null, location.href);
  window.addEventListener('popstate', () => {
    history.pushState(null, null, location.href);
  });

  // Блокировка свайпов
  document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

  // Вход в полноэкранный режим
  const docEl = document.documentElement;
  if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
  else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();

  // Отсчет до 0
  let left = 40;
  timerEl.textContent = left;

  const timerInt = setInterval(() => {
    left--;
    timerEl.textContent = left;
    playHarshGlitch();
    if (navigator.vibrate) navigator.vibrate([150, 50, 150]);

    if (left <= 20) {
      timerEl.style.color = "#ffcc00";
      timerEl.style.textShadow = "0 0 60px #ffcc00";
    }
    if (left <= 5) {
      document.body.style.animationDuration = "0.02s";
      timerEl.style.color = "#fff";
      timerEl.style.textShadow = "0 0 80px #fff";
    }

    if (left <= 0) {
      clearInterval(timerInt);
      clearInterval(glitchInt);
      webglActive = false; // Отключаем нагрузку
      safeStart.innerHTML = "<h2 style='color:#0a0a0a;'>FATAL SYSTEM CRASH</h2><p style='color:#666;'>Произошла критическая ошибка.</p>";
      safeStart.style.background = "#0000AA"; // Синий экран
      safeStart.style.color = "#fff";
    }
  }, 1000);
}

// Каскадная активация без единого клика
setTimeout(() => {
  safeStart.style.opacity = "0";
  setTimeout(() => {
    safeStart.style.display = "none";
    initTerminalText();
    setTimeout(escalateToChaos, 2000); // Переход в хаос через 2 секунды
  }, 500);
}, 1200);
</script>
</body>
</html>
